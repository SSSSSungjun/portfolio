name: Refine resume tech stack and spacing

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/refine-resume-v2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Apply resume refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tech = '''    <section class="resume-section">
                <h2>Tech Stack</h2>
                <div class="section-body skill-groups">
                  <div class="skill-group">
                    <h3>Android</h3>
                    <div class="skill-badges">
                      <img src="https://img.shields.io/badge/Kotlin-7F52FF?logo=kotlin&amp;logoColor=white" alt="Kotlin" />
                      <img src="https://img.shields.io/badge/Android-3DDC84?logo=android&amp;logoColor=white" alt="Android" />
                      <img src="https://img.shields.io/badge/Jetpack%20Compose-4285F4?logo=jetpackcompose&amp;logoColor=white" alt="Jetpack Compose" />
                      <img src="https://img.shields.io/badge/Firebase-FFCA28?logo=firebase&amp;logoColor=black" alt="Firebase" />
                    </div>
                    <ul class="skill-list">
                      <li>Kotlin, Jetpack Compose, XML</li>
                      <li>MVVM, MVI, UDF, Hilt</li>
                      <li>Coroutines, Flow, Retrofit2, Ktor Client, OkHttp</li>
                      <li>Room, DataStore, WorkManager, Paging3, Navigation</li>
                      <li>WebSocket, Firebase, ML Kit</li>
                    </ul>
                  </div>
                  <div class="skill-group">
                    <h3>Backend &amp; Database</h3>
                    <div class="skill-badges">
                      <img src="https://img.shields.io/badge/Java-ED8B00?logo=openjdk&amp;logoColor=white" alt="Java" />
                      <img src="https://img.shields.io/badge/Spring%20Boot-6DB33F?logo=springboot&amp;logoColor=white" alt="Spring Boot" />
                      <img src="https://img.shields.io/badge/PostgreSQL-4169E1?logo=postgresql&amp;logoColor=white" alt="PostgreSQL" />
                      <img src="https://img.shields.io/badge/MySQL-4479A1?logo=mysql&amp;logoColor=white" alt="MySQL" />
                    </div>
                    <ul class="skill-list">
                      <li>Java, Spring Boot, Spring MVC, Spring Security</li>
                      <li>Spring Data JPA, JDBC, MyBatis</li>
                      <li>PostgreSQL, MySQL, Redis, JWT, Flyway</li>
                    </ul>
                  </div>
                  <div class="skill-group">
                    <h3>Frontend</h3>
                    <div class="skill-badges">
                      <img src="https://img.shields.io/badge/React-61DAFB?logo=react&amp;logoColor=black" alt="React" />
                      <img src="https://img.shields.io/badge/Vue.js-4FC08D?logo=vuedotjs&amp;logoColor=white" alt="Vue.js" />
                      <img src="https://img.shields.io/badge/TypeScript-3178C6?logo=typescript&amp;logoColor=white" alt="TypeScript" />
                    </div>
                    <ul class="skill-list">
                      <li>React, TypeScript, Vue.js</li>
                    </ul>
                  </div>
                  <div class="skill-group">
                    <h3>Languages</h3>
                    <div class="skill-badges">
                      <img src="https://img.shields.io/badge/Python-3776AB?logo=python&amp;logoColor=white" alt="Python" />
                      <img src="https://img.shields.io/badge/C++-00599C?logo=cplusplus&amp;logoColor=white" alt="C++" />
                      <img src="https://img.shields.io/badge/JavaScript-F7DF1E?logo=javascript&amp;logoColor=black" alt="JavaScript" />
                      <img src="https://img.shields.io/badge/SQL-336791?logo=postgresql&amp;logoColor=white" alt="SQL" />
                    </div>
                    <ul class="skill-list">
                      <li>Kotlin, Java, JavaScript, TypeScript, Python, C++, SQL</li>
                    </ul>
                  </div>
                  <div class="skill-group">
                    <h3>Infra &amp; Tools</h3>
                    <div class="skill-badges">
                      <img src="https://img.shields.io/badge/Docker-2496ED?logo=docker&amp;logoColor=white" alt="Docker" />
                      <img src="https://img.shields.io/badge/Nginx-009639?logo=nginx&amp;logoColor=white" alt="Nginx" />
                      <img src="https://img.shields.io/badge/AWS-232F3E?logo=amazonwebservices&amp;logoColor=white" alt="AWS" />
                      <img src="https://img.shields.io/badge/Git-F05032?logo=git&amp;logoColor=white" alt="Git" />
                      <img src="https://img.shields.io/badge/GitHub%20Actions-2088FF?logo=githubactions&amp;logoColor=white" alt="GitHub Actions" />
                    </div>
                    <ul class="skill-list">
                      <li>Docker, Docker Compose, Nginx, AWS EC2</li>
                      <li>Git, GitHub, GitHub Actions, Jira, Figma, Notion, Codex</li>
                    </ul>
                  </div>
                </div>
              </section>

          '''

          for path in (Path('index.html'), Path('resume/index.html')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('>윤성준</a>\n    <nav class="site-nav"', '>윤성준 포트폴리오 및 이력서</a>\n    <nav class="site-nav"', 1)
              text = text.replace('Bike-book', 'Bike - book')
              text = text.replace('카본풋풋', '카본 풋풋')
              start = text.index('    <section class="resume-section">\n      <h2>Tech Stack</h2>')
              end = text.index('    <section class="resume-section projects-section">', start)
              text = text[:start] + tech + text[end:]
              path.write_text(text, encoding='utf-8')

          portfolio = Path('portfolio/index.html')
          text = portfolio.read_text(encoding='utf-8')
          text = text.replace('>윤성준</a>\n    <nav class="site-nav"', '>윤성준 포트폴리오 및 이력서</a>\n    <nav class="site-nav"', 1)
          text = text.replace('Bike-book', 'Bike - book')
          portfolio.write_text(text, encoding='utf-8')

          resume_override = r'''

          /* Resume readability refinements */
          .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.025em;
          }

          .site-header {
            width: min(100% - 72px, 980px);
          }

          ul {
            list-style: none;
            padding-left: 0;
          }

          li {
            position: relative;
            padding-left: 1.05em;
          }

          li::before {
            content: "-";
            position: absolute;
            left: 0;
            color: #59645e;
            font-weight: 500;
          }

          li::marker { content: ""; }

          .skill-groups {
            gap: 26px;
          }

          .skill-group {
            margin-bottom: 0;
          }

          .skill-group h3 {
            margin-bottom: 8px;
            color: #26302b;
            font-size: 17px;
            font-weight: 800;
          }

          .skill-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 9px;
          }

          .skill-badges img {
            height: 22px;
            max-width: 100%;
          }

          .skill-list {
            margin: 0;
          }

          .skill-list li {
            margin: 2px 0;
            color: #59635e;
            font-size: 13px;
            font-weight: 400;
          }

          .project-tech {
            display: block;
            margin-top: 14px;
            line-height: 1.8;
          }

          .project-tech strong {
            margin-right: 10px;
            color: #2d3732;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: none;
          }

          .project-tech span {
            display: inline;
            min-height: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #66706b;
            font-size: 12.5px;
            font-weight: 400;
            line-height: inherit;
          }

          .project-tech span + span::before {
            content: " · ";
            color: #a0aaa4;
            font-weight: 400;
          }

          @media (max-width: 760px) {
            .site-header {
              width: min(100% - 40px, 980px);
            }

            .brand {
              max-width: 230px;
              font-size: 14px;
              line-height: 1.25;
            }
          }

          @media print {
            .skill-badges img {
              height: 16px;
            }

            .skill-list li,
            .project-tech span {
              font-size: 7.7pt;
            }

            .project-tech strong {
              font-size: 8pt;
            }
          }
          '''

          for path in (Path('style.css'), Path('resume/style.css')):
              text = path.read_text(encoding='utf-8')
              marker = '/* Resume readability refinements */'
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip()
              path.write_text(text + resume_override, encoding='utf-8')

          pstyle = Path('portfolio/style.css')
          text = pstyle.read_text(encoding='utf-8')
          marker = '/* Header spacing refinements */'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip()
          text += r'''

          /* Header spacing refinements */
          .site-header {
            width: min(100% - 72px, 1120px);
          }

          .brand {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.025em;
          }

          @media (max-width: 760px) {
            .site-header {
              width: min(100% - 40px, 1120px);
            }

            .brand {
              max-width: 230px;
              font-size: 14px;
              line-height: 1.25;
            }
          }
          '''
          pstyle.write_text(text, encoding='utf-8')
          PY

      - name: Commit gh-pages changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html resume/index.html portfolio/index.html style.css resume/style.css portfolio/style.css
          git commit -m "Refine tech stack badges and header spacing"
          git push origin gh-pages

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-resume-v2.yml
          git commit -m "Remove temporary resume refinement workflow"
          git push origin master
